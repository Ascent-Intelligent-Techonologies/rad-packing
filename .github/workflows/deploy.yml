name: Deploy to Vercel

# Vercel's Git integration can't connect a private GitHub org repo on the Hobby plan,
# so this workflow deploys with the Vercel CLI instead. Every push to main goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy configuration
        id: cfg
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning title=Deploy skipped::Set the VERCEL_TOKEN secret (and VERCEL_ORG_ID / VERCEL_PROJECT_ID variables) to enable deploys. See README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Builds on Vercel (prisma generate, prisma migrate deploy, next build) using the
      # project's Production environment variables, including the database URL.
      - name: Deploy to production
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes vercel@65.14.0 deploy --prod --yes --token "$VERCEL_TOKEN"
